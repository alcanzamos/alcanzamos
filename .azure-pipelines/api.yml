# Pipeline de api/: go vet, pruebas con detector de carreras, barrera de cobertura con PostgreSQL, compilación y
# construcción de la imagen.
# No usa conexión de servicio ni secretos. La barrera de cobertura (E17-ECO 5.5) levanta un PostgreSQL desechable en
# Docker (datos sintéticos, solo en 127.0.0.1) para correr también las pruebas de integración.
# La imagen embebe la web, así que también corre cuando cambian web/ o diseno/ (ADR-001, filtros por carpeta).
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - api/*
      - web/*
      - diseno/*
      - .azure-pipelines/api.yml
      - .azure-pipelines/pruebas/cobertura.py

pr:
  branches:
    include:
      - main
  paths:
    include:
      - api/*
      - web/*
      - diseno/*
      - .azure-pipelines/api.yml
      - .azure-pipelines/pruebas/cobertura.py

pool:
  vmImage: ubuntu-24.04

variables:
  GO_VERSION: 1.27.3
  # SHA-256 fijado a mano desde https://go.dev/dl/?mode=json (consultado el 2026-10-22).
  # Cambiar la versión obliga a cambiar también esta suma, el Dockerfile y go.mod.
  GO_SHA256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
  # Misma etiqueta que infra/local/compose.yaml. Contraseña sintética de un contenedor que no sale del agente.
  POSTGRES_IMAGEN: postgres:18.6-alpine
  BASE_DE_DATOS_URL: postgres://alcanzamos:solo-local@127.0.0.1:55432/alcanzamos?sslmode=disable

steps:
  - checkout: self
    fetchDepth: 1

  # Se descarga el tarball oficial y se verifica antes de descomprimirlo.
  - script: |
      set -eu
      tar_go="go$(GO_VERSION).linux-amd64.tar.gz"
      destino="$(Agent.TempDirectory)/go"
      mkdir -p "$destino"
      curl -fsSL "https://go.dev/dl/$tar_go" -o "$destino/$tar_go"
      (cd "$destino" && echo "$(GO_SHA256)  $tar_go" | sha256sum --check --strict -)
      tar -C "$destino" -xzf "$destino/$tar_go"
      echo "##vso[task.prependpath]$destino/go/bin"
    displayName: Instalar Go $(GO_VERSION) (SHA-256 verificado)

  - script: |
      set -eu
      go version
      test "$(go env GOTOOLCHAIN)" = "local" || echo "##vso[task.logissue type=warning]GOTOOLCHAIN no es local"
    displayName: Versión de Go

  - script: test -z "$(gofmt -l .)"
    workingDirectory: api
    displayName: El formato de Go es correcto

  - script: go vet ./...
    workingDirectory: api
    displayName: go vet

  - script: go test -race ./...
    workingDirectory: api
    displayName: Pruebas con detector de carreras

  # Barrera de cobertura (E17-ECO 5.5, D-146, D-148): las pruebas aparte de api/test miden api/src con -coverpkg.
  - script: python3 -I -B .azure-pipelines/pruebas/cobertura.py probar
    displayName: La barrera de cobertura se prueba a sí misma

  - script: |
      set -eu
      docker run --detach --name pg-cobertura \
        --env POSTGRES_DB=alcanzamos --env POSTGRES_USER=alcanzamos --env POSTGRES_PASSWORD=solo-local \
        --publish 127.0.0.1:55432:5432 "$(POSTGRES_IMAGEN)"
      for i in $(seq 1 30); do
        docker exec pg-cobertura pg_isready --username alcanzamos --dbname alcanzamos && exit 0
        sleep 2
      done
      docker logs pg-cobertura
      exit 1
    displayName: PostgreSQL para las pruebas de integración

  - script: go run ./src/cmd/api migrar
    workingDirectory: api
    displayName: Aplicar las migraciones (migrar)

  # -p 1: las pruebas de integración crean y borran bases propias en el mismo PostgreSQL.
  - script: >
      go test -count=1 -p 1 -tags integration -coverpkg=./src/...
      -coverprofile="$(Agent.TempDirectory)/cobertura.out" ./test/...
    workingDirectory: api
    displayName: Pruebas de integración con cobertura de src/

  - script: >
      python3 -I -B .azure-pipelines/pruebas/cobertura.py medir
      "$(Agent.TempDirectory)/cobertura.out" api/test/cobertura-base.json
    displayName: Barrera de cobertura por grupo (90 % núcleo y seguridad, 75 % resto, sin bajar de la base)

  - script: docker rm --force pg-cobertura
    condition: always()
    displayName: Quitar PostgreSQL

  - script: CGO_ENABLED=0 go build -trimpath -o "$(Agent.TempDirectory)/alcanzamos" ./src/cmd/api
    workingDirectory: api
    displayName: go build

  # Contexto: la raíz del monorepo (la imagen compila web/ con Node y la embebe en el binario).
  - script: docker build --file api/Dockerfile --tag alcanzamos-api:$(Build.BuildId) .
    displayName: La imagen se construye
