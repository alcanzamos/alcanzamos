# Pipeline de api/: go vet, golangci-lint, govulncheck con la regla de los 7 días, pruebas con detector de carreras, barrera de
# cobertura con PostgreSQL, compilación y construcción de la imagen.
# No usa conexión de servicio ni secretos. La barrera de cobertura (E17-ECO 5.5) levanta un PostgreSQL desechable en
# Docker (datos sintéticos, solo en 127.0.0.1) para correr también las pruebas de integración.
# La imagen embebe la web, así que también corre cuando cambian web/, diseno/ o el logo que la web importa
# (marca/logo-horizontal-color.svg, D-152) (ADR-001, filtros por carpeta).
# D-183: no corre al fusionar en main. Con la rama al día (protección `strict`) y squash, main queda igual a lo
# que ya se probó en el PR; volver a correrlo solo gasta minutos. Se vuelve a poner cuando haya despliegue.
trigger: none
pr:
  # D-183: un PR borrador no corre; corre cuando se marca «listo para revisar», ya al día con main.
  drafts: false
  branches:
    include:
      - main
  paths:
    include:
      - api/*
      - web/*
      - diseno/*
      - marca/logo-horizontal-color.svg
      - .azure-pipelines/api.yml
      - .azure-pipelines/plantillas/api.yml
      - .azure-pipelines/plantillas/pasos/go.yml
      - .azure-pipelines/pruebas/cobertura.py
      - .azure-pipelines/pruebas/vulnerabilidades.py
      - .azure-pipelines/pruebas/vulnerabilidades_regresion.py

# Los pasos viven en plantillas/api.yml.
jobs:
  - template: plantillas/api.yml
