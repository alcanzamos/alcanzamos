# Control único de los PR a main (D-177, D-178 (4)): el único check obligatorio de main.
# Sin `paths`: corre en todo PR, así ningún PR queda esperando un pipeline que no se disparó. Ejecuta los trabajos de las
# carpetas que cambiaron y falla si alguno falla:
# - `cambios` lista los archivos que cambia el PR y fija una variable de salida por carpeta (pruebas/cambios.py, con el
#   mismo mapa que los filtros de cada pipeline por carpeta; pruebas/filtros.py lo comprueba);
# - `comun` corre siempre; cada etapa por carpeta corre solo si cambió su carpeta, con la misma plantilla que su pipeline
#   por carpeta (plantillas/<carpeta>.yml): los pasos viven una sola vez;
# - al final, `control` corre solo si todas las etapas quedaron bien y `control_rechazo` falla en cualquier otro caso
#   (una etapa que falló, se canceló o no dejó resultado). Una etapa que se saltó porque su carpeta no cambió cuenta
#   como correcta.
# D-183: no corre al fusionar en main ni en un PR borrador; corre una vez cuando el PR se marca «listo para revisar».
trigger: none
pr:
  # D-183: un PR borrador no corre; corre cuando se marca «listo para revisar», ya al día con main.
  drafts: false
  branches:
    include:
      - main

stages:
  # El PR se prueba sobre su commit de fusión con main (refs/pull/<n>/merge): su primer padre es la punta de main, así
  # que la diferencia con él es lo que el PR cambia. Con dos commits de historia alcanza. --no-renames lista también la
  # ruta vieja de un archivo movido; -z evita que git cite los nombres con «ñ». Si no hay commit de fusión (una corrida
  # manual), corren todas las etapas.
  - stage: cambios
    displayName: Carpetas que cambió el PR
    jobs:
      - job: cambios
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              set -euo pipefail
              padres=$(git rev-list --parents -n 1 HEAD | wc -w)
              if [ "$(Build.Reason)" = PullRequest ] && [ "$padres" -eq 3 ]; then
                git diff --name-only --no-renames -z HEAD^1 HEAD | python3 -I -B .azure-pipelines/pruebas/cambios.py detectar
              else
                echo "##vso[task.logissue type=warning]Sin commit de fusión de un PR: corren todas las etapas."
                python3 -I -B .azure-pipelines/pruebas/cambios.py todas
              fi
            name: detectar
            displayName: Etapas que corren (pruebas/cambios.py)

  - stage: comun
    displayName: comun (siempre)
    dependsOn: []
    jobs:
      - template: plantillas/comun.yml

  - stage: reglas
    displayName: reglas (si cambió)
    dependsOn: cambios
    condition: and(succeeded(), eq(dependencies.cambios.outputs['cambios.detectar.reglas'], 'true'))
    jobs:
      - template: plantillas/reglas.yml

  - stage: api
    displayName: api (si cambió)
    dependsOn: cambios
    condition: and(succeeded(), eq(dependencies.cambios.outputs['cambios.detectar.api'], 'true'))
    jobs:
      - template: plantillas/api.yml

  - stage: web
    displayName: web (si cambió)
    dependsOn: cambios
    condition: and(succeeded(), eq(dependencies.cambios.outputs['cambios.detectar.web'], 'true'))
    jobs:
      - template: plantillas/web.yml

  - stage: movil
    displayName: movil (si cambió)
    dependsOn: cambios
    condition: and(succeeded(), eq(dependencies.cambios.outputs['cambios.detectar.movil'], 'true'))
    jobs:
      - template: plantillas/movil.yml

  - stage: infra
    displayName: infra (si cambió)
    dependsOn: cambios
    condition: and(succeeded(), eq(dependencies.cambios.outputs['cambios.detectar.infra'], 'true'))
    jobs:
      - template: plantillas/infra.yml

  # Si `cambios` falla, las etapas por carpeta se saltan y corre `control_rechazo` por `cambios`.
  # Lee el resultado de cada etapa en su condición, como documenta Microsoft («Stage B runs if the result of Stage A is
  # Succeeded, SucceededWithIssues, or Skipped»: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/expressions#dependencies).
  # Una variable de etapa con $[ dependencies.<etapa>.result ] queda vacía (corrida 671), por eso no se usa.
  # `control` corre solo si todas quedaron bien; `control_rechazo` corre y falla en cualquier otro caso: una etapa que
  # falló, se canceló o no dejó resultado (también un nombre mal escrito) deja la corrida en rojo.
  - stage: control
    displayName: Control único (todas las etapas pasaron o se saltaron)
    dependsOn:
      - cambios
      - comun
      - reglas
      - api
      - web
      - movil
      - infra
    condition: and(in(dependencies.cambios.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.comun.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.reglas.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.api.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.web.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.movil.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.infra.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    jobs:
      - job: control
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: none
          - script: echo "Todas las etapas pasaron o se saltaron porque su carpeta no cambió."
            displayName: Todas las etapas pasaron o se saltaron

  - stage: control_rechazo
    displayName: Control único (falla si alguna etapa falló, se canceló o no dejó resultado)
    dependsOn:
      - cambios
      - comun
      - reglas
      - api
      - web
      - movil
      - infra
    condition: not(and(in(dependencies.cambios.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.comun.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.reglas.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.api.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.web.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.movil.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'), in(dependencies.infra.result, 'Succeeded', 'SucceededWithIssues', 'Skipped')))
    jobs:
      - job: control_rechazo
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: none
          - script: |
              echo "FALLA: alguna etapa falló, se canceló o no dejó resultado. Mira las etapas de esta corrida."
              exit 1
            displayName: Alguna etapa no pasó
