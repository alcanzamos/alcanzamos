# Pipeline de movil/: ESLint, tipos, tokens y textos sin diff, pruebas con cobertura, vulnerabilidades y licencias de
# producción y comprobación de que node-forge no entra en el paquete de la app.
# No usa conexión de servicio ni secretos. Corre cuando cambia movil/, diseno/ (tokens, textos y fuentes) o este archivo
# (ADR-001, filtros por carpeta). No compila el paquete de Android (eso lo hace EAS en la entrega, E17): solo exporta
# el paquete de JavaScript para revisarlo.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - movil/*
      - diseno/*
      - marca/logo-horizontal-color.svg
      - .azure-pipelines/movil.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - movil/*
      - diseno/*
      - marca/logo-horizontal-color.svg
      - .azure-pipelines/movil.yml

pool:
  vmImage: ubuntu-24.04

variables:
  NODE_VERSION: 24.22.1
  # SHA-256 fijado a mano desde https://nodejs.org/dist/v24.22.1/SHASUMS256.txt (consultado el 2026-10-22).
  # Cambiar la versión obliga a cambiar también esta suma, web.yml y el campo engines de movil/package.json.
  NODE_SHA256: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
  NPM_VERSION: 12.2.1
  # SHA-512 del tarball de npm 12.2.1, igual al dist.integrity de https://registry.npmjs.org/npm/12.2.1 (base64 pasado
  # a hexadecimal; consultado el 2026-10-24). Cambiar la versión obliga a cambiar también esta suma, web.yml, api/Dockerfile
  # y el campo engines de movil/package.json.
  NPM_SHA512: 6ca0a6151553fc107e60f1186d9c10d57508dcde6de31292a54d4cc4e8e8ef3de25b3281274657442d7115d10df930bb3794ddcb0681cdfd9d317189abf7b63d

steps:
  - checkout: self
    fetchDepth: 1

  # Se descarga el tarball oficial y se verifica antes de descomprimirlo.
  - script: |
      set -eu
      tar_node="node-v$(NODE_VERSION)-linux-x64.tar.xz"
      destino="$(Agent.TempDirectory)/node"
      mkdir -p "$destino"
      curl -fsSL "https://nodejs.org/dist/v$(NODE_VERSION)/$tar_node" -o "$destino/$tar_node"
      (cd "$destino" && echo "$(NODE_SHA256)  $tar_node" | sha256sum --check --strict -)
      tar -C "$destino" -xJf "$destino/$tar_node"
      echo "##vso[task.prependpath]$destino/node-v$(NODE_VERSION)-linux-x64/bin"
    displayName: Instalar Node $(NODE_VERSION) (SHA-256 verificado)

  # npm 12 no viene con Node 24: se descarga el tarball del registro, se verifica y se instala desde el archivo local.
  # Corre fuera de web/ y movil/, así que no lee su .npmrc.
  - script: |
      set -eu
      tar_npm="$(Agent.TempDirectory)/npm-$(NPM_VERSION).tgz"
      curl -fsSL "https://registry.npmjs.org/npm/-/npm-$(NPM_VERSION).tgz" -o "$tar_npm"
      echo "$(NPM_SHA512)  $tar_npm" | sha512sum --check --strict -
      npm install --global "$tar_npm"
      node --version
      npm --version
      test "$(npm --version)" = "$(NPM_VERSION)"
    displayName: Instalar npm $(NPM_VERSION) (SHA-512 verificado)

  # D-158: npm ci no aplica min-release-age a lo que ya está en el lockfile. Antes de instalar, cada versión de
  # movil/package-lock.json se compara con su fecha de publicación en el registro; falla con una versión más joven que
  # min-release-age sin excepción vigente en movil/antiguedad-excepciones.json, con una fecha que no se pueda obtener
  # y con una excepción vencida. No usa dependencias: corre sin node_modules.
  - script: npm run antiguedad
    workingDirectory: movil
    displayName: Antigüedad mínima de las versiones del lockfile (antes de npm ci)

  - script: npm ci
    workingDirectory: movil
    displayName: Dependencias fijadas (npm ci, con movil/.npmrc)

  # Comprueba la firma del registro y las atestaciones de procedencia de cada paquete instalado.
  - script: npm audit signatures
    workingDirectory: movil
    displayName: Firmas del registro (npm audit signatures)

  - script: npm run lint
    workingDirectory: movil
    displayName: ESLint (typescript-eslint, react-hooks, accesibilidad de React Native, solo tokens, sin textos sueltos en JSX)

  - script: npm run typecheck
    workingDirectory: movil
    displayName: Tipos (tsc --noEmit)

  # E17-ECO 4.4: regenerar los tokens no debe cambiar nada.
  - script: |
      set -eu
      npm run tokens
      # El paso corre en movil/: las rutas van relativas a esa carpeta y después de «--».
      git diff --exit-code -- ../diseno ../web ../movil
    workingDirectory: movil
    displayName: Los tokens regenerados no cambian nada

  # E17-ECO 4.13 (D-160): los textos salen de diseno/textos/es.json (comun + solo_android); regenerar el módulo no debe
  # cambiar nada.
  - script: |
      set -eu
      npm run textos
      git diff --exit-code -- ../diseno ../web ../movil
    workingDirectory: movil
    displayName: Los textos regenerados no cambian nada

  - script: npm run test:coverage
    workingDirectory: movil
    displayName: Pruebas unitarias con cobertura (mínimo 50 % de líneas; el resumen final lista las que fallan)

  # ADR-003, condición 4: vulnerabilidades altas o críticas en producción. Las únicas aceptadas están en
  # movil/auditoria-excepciones.json, una por una y con su motivo; la excepción que deja de reportarse hace fallar.
  - script: npm run auditoria
    workingDirectory: movil
    displayName: Vulnerabilidades (npm audit, producción, altas o críticas, con excepciones documentadas)

  # ADR-003, condición 4: licencias de producción compatibles con AGPLv3. La lista general no cambia; las únicas
  # excepciones son por paquete, con su camino y su fecha de revisión, en movil/licencias-excepciones.json (D-150).
  - script: npm run licencias
    workingDirectory: movil
    displayName: Licencias de producción compatibles con AGPLv3 (con excepciones por paquete)

  # D-150: node-forge (excepción de la auditoría) no debe entrar en la app. Genera el paquete de JavaScript de Android
  # en una carpeta temporal y falla si lo encuentra. Tarda unos segundos (medido: 3 a 6 s).
  - script: npm run comprobar-bundle
    workingDirectory: movil
    displayName: node-forge no está en el paquete de la app (expo export)
