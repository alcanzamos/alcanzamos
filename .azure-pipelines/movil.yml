# Pipeline de movil/: ESLint, tipos, tokens y textos sin diff, pruebas con cobertura, vulnerabilidades y licencias de
# producción y comprobación de que node-forge no entra en el paquete de la app.
# No usa conexión de servicio ni secretos. Corre cuando cambia movil/, diseno/ (tokens, textos y fuentes), este archivo o su plantilla
# (ADR-001, filtros por carpeta). No compila el paquete de Android (eso lo hace EAS en la entrega, E17): solo exporta
# el paquete de JavaScript para revisarlo.
# D-183: no corre al fusionar en main. Con la rama al día (protección `strict`) y squash, main queda igual a lo
# que ya se probó en el PR; volver a correrlo solo gasta minutos. Se vuelve a poner cuando haya despliegue.
trigger: none
pr:
  # D-183: un PR borrador no corre; corre cuando se marca «listo para revisar», ya al día con main.
  drafts: false
  branches:
    include:
      - main
  paths:
    include:
      - movil/*
      - diseno/*
      - marca/logo-horizontal-color.svg
      - .azure-pipelines/movil.yml
      - .azure-pipelines/plantillas/movil.yml
      - .azure-pipelines/plantillas/pasos/node.yml

# Los pasos viven en plantillas/movil.yml.
jobs:
  - template: plantillas/movil.yml
