# Trabajo de api/.
# Lo usan api.yml (el pipeline por carpeta) y la etapa api del control único (control.yml, D-177): los pasos
# viven una sola vez. Qué hace cada paso y cuándo corre el pipeline: en api.yml y en el README de esta carpeta.
jobs:
  - job: api
    pool:
      vmImage: ubuntu-24.04
    variables:
      # Etiqueta postgres:18.6-alpine (la de infra/local/compose.yaml), digest del índice multiarquitectura resuelto el
      # 2026-10-23 con `docker buildx imagetools inspect`. Cambiar la etiqueta obliga a cambiar también el digest.
      # Contraseña sintética de un contenedor que no sale del agente.
      POSTGRES_IMAGEN: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
      BASE_DE_DATOS_URL: postgres://alcanzamos:solo-local@127.0.0.1:55432/alcanzamos?sslmode=disable

    steps:
      - checkout: self
        fetchDepth: 1

      # Go fijado con su SHA-256: la versión vive en plantillas/pasos/go.yml, que también usa la revisión diaria.
      - template: pasos/go.yml

      - script: test -z "$(gofmt -l .)"
        workingDirectory: api
        displayName: El formato de Go es correcto

      - script: go vet ./...
        workingDirectory: api
        displayName: go vet

      # golangci-lint v2.15.0 (2026-10-16) está fijado como `tool` en api/go.mod, igual que govulncheck: no se instala nada
      # aparte. Corre errcheck, staticcheck, asciicheck y depguard con api/.golangci.yml (E17-ECO 3.5, Q-2, D-110); falla con
      # cualquier hallazgo (código 1). También cierra A-13: cada error se maneja o su excepción está escrita en la configuración.
      - script: go tool golangci-lint run
        workingDirectory: api
        displayName: Analizador agregado (golangci-lint)

      # govulncheck está fijado como `tool` en api/go.mod (v1.9.0, con sus sumas en go.sum): no se instala nada aparte y no
      # entra en el binario. Con la salida por defecto solo falla (código 3) si el código llama a un símbolo vulnerable;
      # una vulnerabilidad solo de módulo (GO-2026-5932, x/crypto/openpgp, sin corrección, api no importa openpgp) se informa y no falla.
      # revision-diaria.yml corre el mismo comando cada día sobre main: si este paso cambia, cambia también allí.
      - script: go tool govulncheck ./...
        workingDirectory: api
        displayName: Sin vulnerabilidades en símbolos llamados (govulncheck)

      - script: go test -race ./...
        workingDirectory: api
        displayName: Pruebas con detector de carreras

      # Barrera de cobertura (E17-ECO 5.5, D-146, D-148): las pruebas aparte de api/test miden api/src con -coverpkg.
      - script: python3 -I -B .azure-pipelines/pruebas/cobertura.py probar
        displayName: La barrera de cobertura se prueba a sí misma

      - script: |
          set -eu
          docker run --detach --name pg-cobertura \
            --env POSTGRES_DB=alcanzamos --env POSTGRES_USER=alcanzamos --env POSTGRES_PASSWORD=solo-local \
            --publish 127.0.0.1:55432:5432 "$(POSTGRES_IMAGEN)"
          for i in $(seq 1 30); do
            docker exec pg-cobertura pg_isready --username alcanzamos --dbname alcanzamos && exit 0
            sleep 2
          done
          docker logs pg-cobertura
          exit 1
        displayName: PostgreSQL para las pruebas de integración

      - script: go run ./src/cmd/api migrar
        workingDirectory: api
        displayName: Aplicar las migraciones (migrar)

      # -p 1: las pruebas de integración crean y borran bases propias en el mismo PostgreSQL.
      - script: >
          go test -count=1 -p 1 -tags integration -coverpkg=./src/...
          -coverprofile="$(Agent.TempDirectory)/cobertura.out" ./test/...
        workingDirectory: api
        displayName: Pruebas de integración con cobertura de src/

      - script: >
          python3 -I -B .azure-pipelines/pruebas/cobertura.py medir
          "$(Agent.TempDirectory)/cobertura.out" api/test/cobertura-base.json api/src
        displayName: Barrera de cobertura por grupo (90 % núcleo y seguridad, 75 % resto, sin bajar de la base, sin paquetes sin clasificar)

      - script: docker rm --force pg-cobertura
        condition: always()
        displayName: Quitar PostgreSQL

      - script: CGO_ENABLED=0 go build -trimpath -o "$(Agent.TempDirectory)/alcanzamos" ./src/cmd/api
        workingDirectory: api
        displayName: go build

      # Contexto: la raíz del monorepo (la imagen compila web/ con Node y la embebe en el binario).
      - script: docker build --file api/Dockerfile --tag alcanzamos-api:$(Build.BuildId) .
        displayName: La imagen se construye
