# Trabajo de api/.
# Lo usan api.yml (el pipeline por carpeta) y la etapa api del control único (control.yml, D-177): los pasos
# viven una sola vez. Qué hace cada paso y cuándo corre el pipeline: en api.yml y en el README de esta carpeta.
jobs:
  - job: api
    # Espacio de trabajo limpio al empezar (control.yml explica por qué). Sin `pool`: lo fija el pipeline que usa esta plantilla.
    workspace:
      clean: all
    variables:
      # Etiqueta postgres:18.6-alpine (la de infra/local/compose.yaml), digest del índice multiarquitectura resuelto el
      # 2026-10-23 con `docker buildx imagetools inspect`. Cambiar la etiqueta obliga a cambiar también el digest.
      # Contraseña sintética de un contenedor que no sale del agente.
      POSTGRES_IMAGEN: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
      BASE_DE_DATOS_URL: postgres://alcanzamos:solo-local@127.0.0.1:55432/alcanzamos?sslmode=disable

    steps:
      - checkout: self
        fetchDepth: 1

      # Go fijado con su SHA-256: la versión vive en plantillas/pasos/go.yml, que también usa la revisión diaria.
      - template: pasos/go.yml

      - script: test -z "$(gofmt -l .)"
        workingDirectory: api
        displayName: El formato de Go es correcto

      - script: go vet ./...
        workingDirectory: api
        displayName: go vet

      # golangci-lint v2.15.0 (2026-10-16) está fijado como `tool` en api/go.mod, igual que govulncheck: no se instala nada
      # aparte. Corre errcheck, staticcheck, asciicheck y depguard con api/.golangci.yml (E17-ECO 3.5, Q-2, D-110); falla con
      # cualquier hallazgo (código 1). También cierra A-13: cada error se maneja o su excepción está escrita en la configuración.
      - script: go tool golangci-lint run
        workingDirectory: api
        displayName: Analizador agregado (golangci-lint)

      # Barrera de vulnerabilidades con la regla de los 7 días (D-201): cuatro pasos en plantillas/pasos/vulnerabilidades.yml,
      # que también corre la revisión diaria (revision-diaria.yml) sobre main. Qué hace cada uno: en esa plantilla.
      - template: pasos/vulnerabilidades.yml

      - script: go test -race ./...
        workingDirectory: api
        displayName: Pruebas con detector de carreras

      # web/servidor (infra-d205 T14): el servidor de archivos estáticos de ca-web es un módulo de Go aparte, solo con la
      # biblioteca estándar. Corre en esta etapa porque corre cuando cambia web/servidor/* (filtro de api.yml y del control, D-213) y ya
      # trae Go fijado: no hace falta otra instalación ni otro filtro. pruebas/filtros.py comprueba que cada go.mod tenga
      # sus pasos aquí. Misma configuración de lint que el API, con el golangci-lint fijado en api/go.mod.
      - script: test -z "$(gofmt -l .)"
        workingDirectory: web/servidor
        displayName: web/servidor, el formato de Go es correcto

      - script: go vet ./...
        workingDirectory: web/servidor
        displayName: web/servidor, go vet

      - script: |
          set -eu
          golangci_lint="$(go -C ../../api tool -n golangci-lint)"
          "$golangci_lint" run
        workingDirectory: web/servidor
        displayName: web/servidor, analizador agregado (golangci-lint)

      - script: go test -race ./...
        workingDirectory: web/servidor
        displayName: web/servidor, pruebas con detector de carreras

      # Barrera de cobertura (E17-ECO 5.5, D-146, D-148): las pruebas aparte de api/test miden api/src con -coverpkg.
      - script: python3 -I -B .azure-pipelines/pruebas/cobertura.py probar
        displayName: La barrera de cobertura se prueba a sí misma

      # Limpieza por nombre (AGENTS.md: nada de prune; se lista con un filtro y se quita solo lo listado): una corrida cortada
      # (el agente apagado o la máquina suspendida a mitad del trabajo) pudo dejar `pg-cobertura`, y `docker run --name` fallaría
      # con «name already in use». El filtro `^pg-cobertura$` es el nombre exacto, sin parecidos.
      - script: |
          set -eu
          docker ps --all --filter 'name=^pg-cobertura$'
          if [ -n "$(docker ps --all --quiet --filter 'name=^pg-cobertura$')" ]; then
            docker rm --force pg-cobertura
          fi
        displayName: Quitar el PostgreSQL que haya dejado una corrida cortada (por nombre)

      - script: |
          set -eu
          docker run --detach --name pg-cobertura \
            --env POSTGRES_DB=alcanzamos --env POSTGRES_USER=alcanzamos --env POSTGRES_PASSWORD=solo-local \
            --publish 127.0.0.1:55432:5432 "$(POSTGRES_IMAGEN)"
          for i in $(seq 1 30); do
            docker exec pg-cobertura pg_isready --username alcanzamos --dbname alcanzamos && exit 0
            sleep 2
          done
          docker logs pg-cobertura
          exit 1
        displayName: PostgreSQL para las pruebas de integración

      - script: go run ./src/cmd/api migrar
        workingDirectory: api
        displayName: Aplicar las migraciones (migrar)

      # -p 1: las pruebas de integración crean y borran bases propias en el mismo PostgreSQL.
      - script: >
          go test -count=1 -p 1 -tags integration -coverpkg=./src/...
          -coverprofile="$(Agent.TempDirectory)/cobertura.out" ./test/...
        workingDirectory: api
        displayName: Pruebas de integración con cobertura de src/

      - script: >
          python3 -I -B .azure-pipelines/pruebas/cobertura.py medir
          "$(Agent.TempDirectory)/cobertura.out" api/test/cobertura-base.json api/src
        displayName: Barrera de cobertura por grupo (90 % núcleo y seguridad, 75 % resto, sin bajar de la base, sin paquetes sin clasificar)

      # Siempre corre, también si un paso falló, y no falla si el contenedor no existe (el paso que lo crea pudo no correr).
      - script: |
          set -eu
          docker ps --all --filter 'name=^pg-cobertura$'
          if [ -n "$(docker ps --all --quiet --filter 'name=^pg-cobertura$')" ]; then
            docker rm --force pg-cobertura
          fi
        condition: always()
        displayName: Quitar PostgreSQL

      - script: CGO_ENABLED=0 go build -trimpath -o "$(Agent.TempDirectory)/alcanzamos" ./src/cmd/api
        workingDirectory: api
        displayName: go build

      # Contexto: la raíz del monorepo (el .dockerignore de la raíz lo comparten las dos imágenes). La imagen ya no lleva la web:
      # la de ca-web se construye en plantillas/web.yml (T13). Solo se construye: no se publica (pruebas/filtros.py lo comprueba).
      - script: docker build --file api/Dockerfile --tag alcanzamos-api:$(Build.BuildId) .
        displayName: La imagen se construye

      # Limpieza por nombre al final (AGENTS.md: nada de prune; se lista con un filtro y se quita solo lo listado). Siempre
      # corre, también si un paso falló, y no falla si el objeto no existe (el paso que lo crea pudo no correr):
      # - el contenedor pg-cobertura, otra vez (el paso de arriba ya lo quita; así queda quitado aunque ese paso se salte);
      # - la imagen que este trabajo construyó, por su etiqueta exacta `alcanzamos-api:$(Build.BuildId)`;
      # - la imagen de PostgreSQL, por su referencia fijada ($(POSTGRES_IMAGEN)): con digest, Docker la guarda sin etiqueta,
      #   así que se lista por el nombre del repositorio y se quita solo si el digest listado es el fijado.
      # Si una imagen no se puede quitar, avisa (queda en Partially succeeded, que el control acepta) y el último paso muestra lo que quedó.
      - script: |
          set -u
          docker ps --all --filter 'name=^pg-cobertura$'
          if [ -n "$(docker ps --all --quiet --filter 'name=^pg-cobertura$')" ]; then
            docker rm --force pg-cobertura
          fi
          imagen="alcanzamos-api:$(Build.BuildId)"
          docker image ls --filter "reference=$imagen"
          if [ -n "$(docker image ls --quiet --filter "reference=$imagen")" ]; then
            docker rmi "$imagen" || echo "##vso[task.logissue type=warning]No se pudo quitar la imagen $imagen"
          fi
          imagen="$(POSTGRES_IMAGEN)"
          digest="${imagen#*@}"
          repositorio="${imagen%%[:@]*}"
          docker image ls --digests --filter "reference=$repositorio"
          if docker image ls --digests --filter "reference=$repositorio" --format '{{.Digest}}' | grep -qxF "$digest"; then
            docker rmi "$imagen" || docker rmi "$repositorio@$digest" \
              || echo "##vso[task.logissue type=warning]No se pudo quitar la imagen $imagen"
          fi
        condition: always()
        displayName: Quitar el contenedor y las imágenes de este trabajo (por nombre)

      # Evidencia E4: lo que queda en el demonio de Docker del CI al terminar el trabajo.
      - script: |
          docker ps --all
          docker image ls --digests
        condition: always()
        displayName: Lo que queda en Docker (docker ps -a, docker image ls --digests)
