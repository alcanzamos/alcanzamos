# Trabajo de reglas/.
# Lo usan reglas.yml (el pipeline por carpeta) y la etapa reglas del control único (control.yml, D-177): los pasos
# viven una sola vez. Qué hace cada paso y cuándo corre el pipeline: en reglas.yml y en el README de esta carpeta.
jobs:
  - job: reglas
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: 1

      - script: sha256sum --check --strict SHA256SUMS
        workingDirectory: reglas/conjuntos
        displayName: Los conjuntos coinciden con SHA256SUMS

      # Los valores esperados también quedan aquí: cambiar un conjunto exige cambiar este pipeline,
      # no solo SHA256SUMS.
      - script: |
          set -eu
          esperado="297c6fbde186ab19ec82079ed1e90225aa51f156689a2da355aefe1defe72150  conjunto-de-prueba.jsonl
          6c37977380200f2512055d09fc41126991672fb99aa114dfbdc07fcaf2a78fbc  conjunto-de-confirmacion.jsonl"
          echo "$esperado" | sed 's/^ *//' | sha256sum --check --strict
        workingDirectory: reglas/conjuntos
        displayName: Los conjuntos coinciden con los SHA-256 congelados

      # reglas.json (versión D-1.0, D-075 (4)) y la referencia de IAR-004: la salida del prototipo de Python para cada mensaje
      # de los dos conjuntos. Ninguno se edita: un cambio crea una versión nueva con su propio hash.
      - script: sha256sum --check --strict SHA256SUMS
        workingDirectory: reglas
        displayName: reglas.json y la referencia coinciden con SHA256SUMS

      - script: |
          set -eu
          esperado="5d130dbc945679c3f8ad52f17c8cdabda89fb64f074fb6abde637d0ec5f3153c  reglas.json
          f54b9b3c6f409212ba909f0ee3f5579de9f5ea69638197d64ae34cf76e7c1574  referencia/referencia-prueba.jsonl
          d58f1b0a3456f1c7243a24f1d879320e25f997bd3091edc90712835ef0631368  referencia/referencia-confirmacion.jsonl"
          echo "$esperado" | sed 's/^ *//' | sha256sum --check --strict
        workingDirectory: reglas
        displayName: reglas.json y la referencia coinciden con los SHA-256 congelados

      # Go no puede embeber archivos de fuera de api/ y la imagen solo copia api/: el motor lleva una copia idéntica.
      - script: cmp reglas/reglas.json api/src/interpretacion/reglas.json
        displayName: La copia de reglas.json dentro de api/ es idéntica
