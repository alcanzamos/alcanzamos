# Trabajo de web/.
# Lo usan web.yml (el pipeline por carpeta) y la etapa web del control único (control.yml, D-177): los pasos
# viven una sola vez. Qué hace cada paso y cuándo corre el pipeline: en web.yml y en el README de esta carpeta.
jobs:
  - job: web
    # Espacio de trabajo limpio al empezar (control.yml explica por qué). Sin `pool`: lo fija el pipeline que usa esta plantilla.
    workspace:
      clean: all
    variables:
      # Imagen oficial de Playwright para el e2e (D3), versión v1.64.1 sobre Ubuntu 24.04 (noble, como el agente hospedado),
      # fijada por su digest (índice multiarquitectura; amd64 sha256:ee15712262f017b8157421b212b12099146645f44b1bc5c0514cbbe6a229b1d0).
      # Fechas del catálogo de MCR, leídas el 2026-11-20: createdDate 2026-10-14 y lastModifiedDate 2026-11-01 (19 días o más: cumple los 7).
      # La versión de la etiqueta debe ser la de `@playwright/test` en web/package.json: pruebas/filtros.py lo comprueba
      # («If the Playwright version in your Docker image does not match the version in your project/tests, Playwright will be
      # unable to locate browser executables», https://playwright.dev/docs/docker). Cambiar la etiqueta obliga a cambiar también el digest.
      PLAYWRIGHT_IMAGEN: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      - checkout: self
        fetchDepth: 1

      # Node y npm fijados con sus sumas: las versiones viven en plantillas/pasos/node.yml, que también usan movil y la
      # revisión diaria.
      - template: pasos/node.yml

      # D-158: npm ci no aplica min-release-age a lo que ya está en el lockfile. Antes de instalar, cada versión de
      # web/package-lock.json se compara con su fecha de publicación en el registro; falla con una versión más joven que
      # min-release-age sin excepción vigente en web/antiguedad-excepciones.json, con una fecha que no se pueda obtener
      # y con una excepción vencida. No usa dependencias: corre sin node_modules.
      - script: npm run antiguedad
        workingDirectory: web
        displayName: Antigüedad mínima de las versiones del lockfile (antes de npm ci)

      - script: npm ci
        workingDirectory: web
        displayName: Dependencias fijadas (npm ci, con web/.npmrc)

      # Comprueba la firma del registro y las atestaciones de procedencia de cada paquete instalado.
      - script: npm audit signatures
        workingDirectory: web
        displayName: Firmas del registro (npm audit signatures)

      # ADR-003, condición 4: vulnerabilidades altas o críticas en producción y licencias compatibles con AGPLv3.
      # revision-diaria.yml corre el mismo `npm run auditoria` cada día sobre main.
      - script: npm run auditoria
        workingDirectory: web
        displayName: Vulnerabilidades (npm audit, producción, altas o críticas)

      - script: npm run licencias
        workingDirectory: web
        displayName: Licencias de producción compatibles con AGPLv3

      - script: npm run typecheck
        workingDirectory: web
        displayName: Tipos (tsc --noEmit)

      - script: npm run lint
        workingDirectory: web
        displayName: ESLint

      - script: npm run format:check
        workingDirectory: web
        displayName: Prettier

      # E17-ECO 4.4: regenerar los tokens no debe cambiar nada.
      - script: |
          set -eu
          npm run tokens
          # El paso corre en web/: las rutas van relativas a esa carpeta y después de «--».
          git diff --exit-code -- ../diseno ../web ../movil
        workingDirectory: web
        displayName: Los tokens regenerados no cambian nada

      # E17-ECO 4.13 (D-160): los textos salen de diseno/textos/es.json; regenerar el módulo no debe cambiar nada.
      - script: |
          set -eu
          npm run textos
          git diff --exit-code -- ../diseno ../web ../movil
        workingDirectory: web
        displayName: Los textos regenerados no cambian nada

      - script: npm run test:coverage
        workingDirectory: web
        displayName: Pruebas unitarias con cobertura (mínimo 60 % de líneas)

      - script: npm run build
        workingDirectory: web
        displayName: Compilación (vite build)

      # D3 (L3, L5): el e2e corre dentro de la imagen oficial de Playwright, el mismo paso en el agente propio y en el hospedado.
      # `npx playwright install --with-deps` instala paquetes con apt-get como root y Playwright solo soporta Debian y Ubuntu
      # (https://playwright.dev/docs/browsers): sin sudo y en Arch no funciona. La imagen ya trae el navegador y sus bibliotecas.
      # Opciones, de https://playwright.dev/docs/docker:
      # - --init: «Using `--init` Docker flag is recommended to avoid special treatment for processes with PID=1»;
      # - --ipc=host: «Using `--ipc=host` is recommended when using Chromium. Without it, Chromium can run out of memory and crash»;
      # - root dentro del contenedor, sin crear otro usuario: «On trusted websites, you can avoid creating a separate user and
      #   use root for it since you trust the code which will run on the browsers». Es código propio. Con el Docker sin root del
      #   agente propio, ese root es el usuario azpipelines afuera. En el agente hospedado (Docker con root) los archivos que el
      #   e2e escribe en el espacio de trabajo (web/dist, web/test-results) quedan de root; la máquina se descarta al terminar.
      # - --rm: el contenedor se borra al terminar.
      # Se monta el espacio de trabajo en la misma ruta y se trabaja desde web/ (ahí están playwright.config.ts y node_modules,
      # instalados antes con `npm ci`). El e2e usa el Node y el npm de plantillas/pasos/node.yml, montados de solo lectura y
      # primeros en el PATH, y NO el Node de la imagen (L5): el contenedor corre `npm run e2e` con las mismas versiones que el
      # resto del trabajo. La versión de la carpeta de Node debe ser la de plantillas/pasos/node.yml (pruebas/filtros.py lo
      # comprueba). `webServer` de playwright.config.ts levanta `vite preview` en 127.0.0.1:4173, dentro del propio contenedor.
      - script: |
          set -eu
          node_del_agente="$(Agent.TempDirectory)/node/node-v24.22.1-linux-x64"
          test -x "$node_del_agente/bin/node"
          docker run --rm --init --ipc=host \
            --volume "$(Build.SourcesDirectory):$(Build.SourcesDirectory)" \
            --volume "$node_del_agente:/opt/node:ro" \
            --workdir "$(Build.SourcesDirectory)/web" \
            --env CI=true \
            --env PATH=/opt/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$(PLAYWRIGHT_IMAGEN)" npm run e2e
        displayName: Playwright con axe-core sobre la app compilada (imagen oficial de Playwright)

      # La imagen de ca-web (T13, E11-INF 2.16): Node compila web/ con diseno/ y el logo, Go compila web/servidor y la base es
      # distroless nonroot. Solo se construye, no se publica: un Dockerfile roto (un digest que ya no existe, un COPY que no
      # encuentra su archivo, una compilación que falla) hace fallar el PR. Contexto: la raíz del monorepo.
      # pruebas/filtros.py comprueba que este paso corra de verdad y no publique.
      - script: docker build --file web/Dockerfile --tag alcanzamos-web:$(Build.BuildId) .
        displayName: La imagen se construye

      # Limpieza por nombre (AGENTS.md: nada de prune; se lista con un filtro y se quita solo lo listado): la imagen que este
      # trabajo construyó (H4: `alcanzamos-web:$(Build.BuildId)`). La de Playwright, fijada por digest, no se quita: no guarda nada de la
      # corrida y la vieja se quita en el mantenimiento mensual (M3, D-213). Siempre
      # corre, también si un paso falló, y no falla si el objeto no existe (el paso que lo crea pudo no correr). Si no
      # se puede quitar, avisa con un aviso en el registro de la corrida (el aviso no cambia el resultado del paso) y el último paso muestra lo que quedó.
      - script: |
          set -u
          imagen="alcanzamos-web:$(Build.BuildId)"
          docker image ls --filter "reference=$imagen"
          if [ -n "$(docker image ls --quiet --filter "reference=$imagen")" ]; then
            docker rmi "$imagen" || echo "##vso[task.logissue type=warning]No se pudo quitar la imagen $imagen"
          fi
        condition: always()
        displayName: Quitar la imagen que construyó este trabajo (por nombre)

      # Evidencia E4: lo que queda en el demonio de Docker del CI al terminar el trabajo.
      - script: |
          docker ps --all
          docker image ls --digests
        condition: always()
        displayName: Lo que queda en Docker (docker ps -a, docker image ls --digests)
